<!DOCTYPE html>
<html>
<head>
    <title>Multimedia</title>
</head>
<body>

    <h2>Image</h2>
    <img src="college.jpg"
         alt="College campus"
         width="260"
         height="260">

    <h2>Video</h2>
    <video width="340" height="200" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

    <h2>Audio</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <h2>YouTube</h2>
    <iframe
        width="550"
        height="315"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube video"
        allowfullscreen>
    </iframe>

</body>
</html>
